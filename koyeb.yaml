name: ai-chatting
services:
  - name: web
    type: web
    env: docker
    docker:
      dockerfile: Dockerfile
    ports:
      - port: 3000
        protocol: http
    routes:
      - path: /
    env_vars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: SUPABASE_URL
        value: ""
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: ""
      - key: GEMINI_API_KEY
        value: ""
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: SESSION_SECRET
        value: ""
      - key: ADMIN_USER_ID
        value: ""
